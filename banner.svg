<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#101410"/>
      <stop offset="100%" stop-color="#1b2119"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#a3ff12" stroke-opacity=".06"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#b7ff85" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect width="800" height="300" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="800" height="300" fill="url(#bg)"/>
    <rect width="800" height="300" fill="url(#grid)"/>
    <rect width="800" height="300" fill="url(#scan)"/>

    <!-- title bar -->
    <rect width="800" height="40" fill="#090c09"/>
    <circle cx="24" cy="20" r="5.5" fill="#ff5f57"/>
    <circle cx="44" cy="20" r="5.5" fill="#febc2e"/>
    <circle cx="64" cy="20" r="5.5" fill="#28c840"/>
    <g font-family="monospace" font-size="13" fill="#9aaa91">
      <text x="88" y="25">TERMINAL_01 — bash</text>
      <text x="776" y="25" text-anchor="end">198X / SYSTEM ONLINE</text>
    </g>

    <!-- name -->
    <text x="43" y="116" fill="#a3ff12" opacity=".25"
          font-family="monospace" font-size="58" font-weight="bold">PRASHAST AWASTHI</text>
    <text x="40" y="113" fill="#a3ff12" font-family="monospace" font-size="58"
          font-weight="bold" filter="url(#glow)">PRASHAST AWASTHI</text>

    <!-- command box -->
    <rect x="40" y="142" width="720" height="66" rx="4" fill="#080b08" stroke="#46583b"/>
    <rect x="40" y="142" width="5" height="66" fill="#a3ff12"/>
    <text x="64" y="184" fill="#a3ff12" font-family="monospace" font-size="26">&gt;</text>
    <text x="96" y="184" fill="#dce8d4" font-family="monospace" font-size="26">git commit -m "it is what it is"</text>
    <rect x="534" y="160" width="13" height="30" fill="#a3ff12">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- footer -->
    <path d="M40 240H760" stroke="#46583b"/>
    <g font-family="monospace" font-size="13" fill="#9aaa91">
      <text x="40" y="232">C:\USER\PRASHAST&gt; _</text>
      <text x="760" y="232" text-anchor="end">MEM: 640K OUGHT TO BE ENOUGH</text>
    </g>
    <g transform="translate(40 256)" fill="#a3ff12">
      <rect width="26" height="7"/><rect x="32" width="26" height="7"/><rect x="64" width="26" height="7"/>
      <rect x="96" width="26" height="7" opacity=".55"/><rect x="128" width="26" height="7" opacity=".25"/>
      <rect x="160" width="26" height="7" opacity=".12"/>
    </g>
    <text x="760" y="266" text-anchor="end" fill="#a3ff12" font-family="monospace" font-size="13">END OF LINE_</text>
  </g>
</svg>
