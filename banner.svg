
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#101410"/>
      <stop offset="100%" stop-color="#1b2119"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a3ff12" stroke-opacity=".06"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#b7ff85" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screen">
      <rect width="1200" height="260" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <rect width="1200" height="260" fill="url(#scan)"/>

    <rect width="1200" height="34" fill="#090c09"/>
    <circle cx="22" cy="17" r="4" fill="#ff5f57"/>
    <circle cx="38" cy="17" r="4" fill="#febc2e"/>
    <circle cx="54" cy="17" r="4" fill="#28c840"/>

    <g font-family="monospace" font-size="10" fill="#82917a">
      <text x="78" y="21">TERMINAL_01 — bash</text>
      <text x="1158" y="21" text-anchor="end">198X / SYSTEM ONLINE</text>
    </g>

    <text x="65" y="100" fill="#a3ff12" opacity=".25"
          font-family="monospace" font-size="53" font-weight="bold">
      PRASHAST AWASTHI
    </text>
    <text x="61" y="96" fill="#a3ff12"
          font-family="monospace" font-size="53" font-weight="bold"
          filter="url(#glow)">
      PRASHAST AWASTHI
    </text>

    <rect x="64" y="122" width="720" height="54" rx="3"
          fill="#080b08" stroke="#46583b"/>
    <rect x="64" y="122" width="4" height="54" fill="#a3ff12"/>

    <text x="83" y="155" fill="#a3ff12"
          font-family="monospace" font-size="18">&gt;</text>
    <text x="109" y="155" fill="#dce8d4"
          font-family="monospace" font-size="18">git commit -m "it is what it is"</text>

    <rect x="448" y="136" width="9" height="20" fill="#a3ff12">
      <animate attributeName="opacity" values="1;0;1"
               dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <g fill="#a3ff12" opacity=".65">
      <rect x="1050" y="70" width="8" height="8"/>
      <rect x="1062" y="70" width="8" height="8" opacity=".4"/>
      <rect x="1074" y="70" width="8" height="8" opacity=".2"/>
      <rect x="1098" y="70" width="8" height="8" opacity=".5"/>
      <rect x="1110" y="70" width="8" height="8" opacity=".25"/>
    </g>

    <path d="M64 202H1136" stroke="#46583b"/>
    <g font-family="monospace" font-size="10" fill="#78876d">
      <text x="65" y="193">C:\USER\PRASHAST&gt; _</text>
      <text x="1135" y="193" text-anchor="end">MEM: 640K OUGHT TO BE ENOUGH</text>
    </g>

    <g transform="translate(65 214)" fill="#a3ff12">
      <rect width="18" height="5"/>
      <rect x="23" width="18" height="5"/>
      <rect x="46" width="18" height="5"/>
      <rect x="69" width="18" height="5" opacity=".55"/>
      <rect x="92" width="18" height="5" opacity=".25"/>
      <rect x="115" width="18" height="5" opacity=".12"/>
    </g>
    <text x="1136" y="220" text-anchor="end"
          fill="#a3ff12" font-family="monospace" font-size="10">END OF LINE_</text>
  </g>
</svg>
