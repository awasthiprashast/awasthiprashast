
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#101410"/>
      <stop offset="100%" stop-color="#1b2119"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a3ff12"/>
      <stop offset="100%" stop-color="#d5ff8f"/>
    </linearGradient>

    <pattern id="scanlines" width="4" height="4"
             patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#b7ff85" stroke-opacity=".055"/>
    </pattern>

    <pattern id="grid" width="32" height="32"
             patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none"
            stroke="#a3ff12" stroke-opacity=".07"/>
    </pattern>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="screen">
      <rect width="1200" height="300" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#scanlines)"/>

    <!-- Retro terminal header -->
    <rect x="0" y="0" width="1200" height="35" fill="#090c09"/>
    <circle cx="22" cy="17" r="4" fill="#ff5f57"/>
    <circle cx="38" cy="17" r="4" fill="#febc2e"/>
    <circle cx="54" cy="17" r="4" fill="#28c840"/>

    <text x="78" y="21" fill="#82917a"
          font-family="monospace" font-size="11">
      TERMINAL_01 — bash
    </text>

    <text x="1160" y="21" text-anchor="end"
          fill="#65725f" font-family="monospace" font-size="10">
      198X / SYSTEM ONLINE
    </text>

    <!-- Decorative pixel blocks -->
    <g fill="#a3ff12" opacity=".65">
      <rect x="1090" y="74" width="8" height="8"/>
      <rect x="1102" y="74" width="8" height="8" opacity=".35"/>
      <rect x="1114" y="74" width="8" height="8" opacity=".15"/>
      <rect x="1126" y="74" width="8" height="8" opacity=".5"/>
      <rect x="1148" y="74" width="8" height="8" opacity=".25"/>
    </g>

    <!-- CRT-style name -->
    <text x="66" y="126" fill="#a3ff12" opacity=".20"
          font-family="monospace" font-size="52" font-weight="bold"
          letter-spacing="-2">
      PRASHAST AWASTHI
    </text>

    <text x="62" y="122" fill="url(#green)"
          font-family="monospace" font-size="52" font-weight="bold"
          letter-spacing="-2" filter="url(#glow)">
      PRASHAST AWASTHI
    </text>

    <!-- Terminal prompt -->
    <rect x="64" y="157" width="720" height="58" rx="3"
          fill="#080b08" stroke="#46583b" stroke-width="1"/>

    <rect x="64" y="157" width="4" height="58" fill="#a3ff12"/>

    <text x="84" y="192" fill="#a3ff12"
          font-family="monospace" font-size="18">&gt;</text>

    <text x="110" y="192" fill="#dce8d4"
          font-family="monospace" font-size="18">
      git commit -m "it is what it is"
    </text>

    <!-- Blinking cursor -->
    <rect x="503" y="174" width="10" height="22" fill="#a3ff12">
      <animate attributeName="opacity"
               values="1;1;0;0;1"
               keyTimes="0;0.45;0.5;0.95;1"
               dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Minimal retro status details -->
    <g font-family="monospace" font-size="10" fill="#78876d">
      <text x="66" y="248">C:\USER\PRASHAST&gt; _</text>
      <text x="1134" y="248" text-anchor="end">MEM: 640K OUGHT TO BE ENOUGH</text>
    </g>

    <path d="M64 262H1136" stroke="#46583b" stroke-width="1"/>

    <!-- Bottom pixel progress bar -->
    <g transform="translate(66 274)">
      <rect width="18" height="5" fill="#a3ff12"/>
      <rect x="23" width="18" height="5" fill="#a3ff12"/>
      <rect x="46" width="18" height="5" fill="#a3ff12"/>
      <rect x="69" width="18" height="5" fill="#a3ff12" opacity=".55"/>
      <rect x="92" width="18" height="5" fill="#a3ff12" opacity=".25"/>
      <rect x="115" width="18" height="5" fill="#a3ff12" opacity=".12"/>
    </g>

    <text x="1136" y="280" text-anchor="end"
          fill="#a3ff12" font-family="monospace" font-size="10">
      END OF LINE_
    </text>

    <!-- Subtle moving scan bar -->
    <rect x="0" y="35" width="1200" height="2"
          fill="#d5ff8f" opacity=".13">
      <animate attributeName="y"
               values="35;295;35"
               dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
